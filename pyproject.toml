[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psafe"
version = "0.1.0"
description = "Parking tower safety detection pipeline (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
onnx = ["onnxruntime"]
# Coral / TFLite 실행기. 환경마다 구할 수 있는 패키지가 달라 둘로 나눈다 (docs/edge_tpu/DISCUSSION.md R3 짝 ②)
#   Pi (Python <= 3.12): pip install -e .[tflite] -c requirements/tpu-py312.txt
#   최신 Python / Windows: pip install -e .[litert]   (Edge TPU delegate 호환은 미검증)
tflite = ["tflite-runtime"]
litert = ["ai-edge-litert"]
serial = ["pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: real-time tests (threaded scenarios). Run with: pytest -m slow"]
