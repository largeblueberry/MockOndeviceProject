[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "psafe"
version = "0.1.0"
description = "Parking tower safety detection pipeline (MVP)"
requires-python = ">=3.11"
dependencies = [
    "numpy",
    "opencv-python",
    "pyyaml",
]

[project.optional-dependencies]
dev = ["pytest"]
onnx = ["onnxruntime"]
serial = ["pyserial"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-m 'not slow'"
markers = ["slow: real-time tests (threaded scenarios). Run with: pytest -m slow"]
