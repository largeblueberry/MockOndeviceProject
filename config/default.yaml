# Pipeline configuration (DESIGN.md §9)
# Pluggable parts: `name` picks the implementation, `options` go to its constructor.

source:
  name: dummy               # dummy | video | webcam | picamera
  options:
    scenario: scenarios/entry_normal.yaml
    width: 640
    height: 480

model:
  name: dummy               # dummy | yolo_onnx | ...
  options: {}

outputs:
  - name: console           # console | serial | mock_mcu
    options: {}

fsm:
  person_conf_low: 0.30
  clear_time_s: 3.0
  clear_min_frames: 10
  max_frame_age_ms: 500
  fault_recover_frames: 5
  roi: [[0.1, 0.1], [0.9, 0.1], [0.9, 0.9], [0.1, 0.9]]

health:
  min_brightness: 10
  max_brightness: 245
  freeze_diff_threshold: 0.5
  max_decision_age_ms: 600

runner:
  mode: sync                # sync | threaded
  clock: auto               # auto | real | fake
  heartbeat_ms: 200
  metrics_interval_s: 5
