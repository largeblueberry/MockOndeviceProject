# 녹화 영상 + YOLO ONNX. 웹캠과 같은 파이프라인이며, 입력을 반복 재현할 수 있다.
#   python -m psafe --config config/video_yolo.yaml
# runner.mode: sync + clock: fake  -> 모델이 허용하는 최대 속도로 실행, 결정적
# runner.mode: threaded            -> 실시간, 실제 카메라와 동일

source:
  name: video
  options: { path: recordings/clip.mp4, loop: false }

model:
  name: yolo_onnx
  options:
    weights: models/yolo11n_320.onnx

outputs:
  - name: console
  - name: viewer

runner:
  mode: threaded
