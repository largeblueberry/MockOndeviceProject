# 실시간 웹캠 + YOLO ONNX + 화면 창.
#   python -m psafe --config config/webcam_yolo.yaml
# 모델 교체는 model.options.weights를 바꾸면 된다 (예: yolo11n_640.onnx).

source:
  name: webcam
  options: { index: 0, width: 640, height: 480, fps: 30 }

model:
  name: yolo_onnx
  options:
    weights: models/yolo11n_320.onnx
    conf_threshold: 0.20
    threads: 4
    # class_map: { minifig: person }   # 파인튜닝 모델 클래스 -> 내부 이름

outputs:
  - name: console
  - name: viewer
    options:
      scale: 1.0
      # record_path: recordings/demo.mp4

fsm:
  person_conf_low: 0.30
  clear_time_s: 3.0
  clear_min_frames: 10
  max_frame_age_ms: 500
  fault_recover_frames: 5
  roi: [[0.1, 0.1], [0.9, 0.1], [0.9, 0.9], [0.1, 0.9]]

health:
  min_brightness: 10
  max_brightness: 245
  freeze_diff_threshold: 0.05       # PC 웹캠 정지 장면 노이즈 0.20-0.28 (2026-11-14). 멈춘 카메라는 ~0
  freeze_frames: 15                # 30 fps 기준 ~0.5초. 1로 두면 실제 웹캠에서 frozen_frame 오탐 발생 (2026-11-14)

runner:
  mode: threaded
  heartbeat_ms: 200
  max_decision_age_ms: 600
  metrics_interval_s: 5
